name: CI

# audit and tests run on every push.
# On main: the image is built in parallel, and deploy runs only when tests and build
# are green (audit only reports, it never blocks).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ———————————————————————————————————————————————————————————————————————————
  # Known vulnerabilities in dependencies. Reads only the lock file — nothing is installed.
  # Informational: findings are reported as warnings (annotation + job summary) but never block
  # merging or deploy — advisories often appear before a fixed version exists.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit
        id: npm-audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Report findings
        if: steps.npm-audit.outcome == 'failure'
        run: |
          echo "::warning title=npm audit::Known vulnerabilities in npm dependencies, see the audit job log"
          echo "⚠️ **npm audit** found known vulnerabilities — see the log of the corresponding step." >> "$GITHUB_STEP_SUMMARY"

  # ———————————————————————————————————————————————————————————————————————————
  # Unit tests (Karma, headless Chrome of the runner) and the production build (Angular + prerender)
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (Karma)
        run: npx ng test --no-watch --no-progress --code-coverage

      # —— Coverage report: job summary + downloadable HTML artifact ————————
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage.txt') != ''
        run: |
          {
            echo "### Code coverage"
            echo '```'
            cat coverage/coverage.txt
            echo '```'
            echo "Full HTML report: download the **coverage** artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage/clover.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 30

      - name: Check test coverage
        uses: johanvanhelden/gha-clover-test-coverage-check@v1
        with:
          percentage: "95"
          filename: "coverage/clover.xml"

      - name: Build (Angular)
        run: npx ng build

  # ———————————————————————————————————————————————————————————————————————————
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image reference
        id: image
        run: echo "ref=${REGISTRY}/${IMAGE_NAME,,}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true   # into the local docker daemon: smoke-tested first, pushed only if it passes
          tags: ${{ steps.image.outputs.ref }}
          # one image = one package version (no attestation manifests),
          # so the retention cleanup below can't delete parts of a kept image
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: .github/scripts/smoke-test.sh "${{ steps.image.outputs.ref }}"

      - name: Push image
        run: docker push "${{ steps.image.outputs.ref }}"

  # ———————————————————————————————————————————————————————————————————————————
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [tests, build]   # not audit: it is informational
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read   # GITHUB_TOKEN is used on the server to pull the private image from GHCR
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/compose.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            umask 077
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > .env
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            healthy=no
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' placeholder-service-ui)" = healthy ] && { healthy=yes; break; }
              sleep 2
            done
            [ "$healthy" = yes ] || { echo "placeholder-service-ui did not become healthy"; docker compose logs --tail=100 app; exit 1; }
            echo "placeholder-service-ui is healthy"

  # ———————————————————————————————————————————————————————————————————————————
  # Keep the 10 most recent images in GHCR (rollback targets), delete older ones.
  cleanup-images:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
